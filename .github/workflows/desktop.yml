# Builds the SADE desktop app (Tauri, frontend/src-tauri) for Windows, macOS
# (Apple Silicon + Intel) and Linux on GitHub's own machines - a Mac is not
# needed to build the Mac version.
#
# Run it by pushing a tag:   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
# or by hand from the Actions tab (workflow_dispatch).
#
# The installers land as artifacts of the run (Actions > the run > Artifacts),
# never published anywhere on their own. Copy them into the server's
# downloads/ folder (with downloads.json) for the site's /descarca/ page.
#
# Not set up yet (needs accounts and secrets only the owner can create):
# - macOS signing + notarisation (Apple Developer ID): without it macOS warns
#   that the app is from an unidentified developer.
# - Windows code signing: without it SmartScreen shows "unknown publisher".
# - The updater's signing key (TAURI_SIGNING_PRIVATE_KEY).
name: desktop

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            name: windows
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: macos-arm
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            name: macos-intel
          - platform: ubuntu-22.04
            args: ''
            name: linux
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - run: npm ci

      - name: Build the app
        run: npx tauri build ${{ matrix.args }}
        env:
          # The server a fresh install signs in to (changeable in the app).
          VITE_SADE_SERVER: ${{ vars.SADE_SERVER_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: sade-${{ matrix.name }}
          path: |
            frontend/src-tauri/target/**/release/bundle/nsis/*.exe
            frontend/src-tauri/target/**/release/bundle/msi/*.msi
            frontend/src-tauri/target/**/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/**/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: error
